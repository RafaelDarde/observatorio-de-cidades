[project]
name = "observatorio"
version = "0.1.0"
description = "Pipeline de dados do Observatório de Cidades"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "jsonschema>=4.26.0",
    "py7zr>=1.1.4",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
observatorio = "observatorio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observatorio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
